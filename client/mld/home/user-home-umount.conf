# Unmounts the CIFS home after the user manager stops (see /usr/local/sbin/mld-home-umount).
# "+": run as root. user@.service has User=%i and PAMName=systemd-user; without "+" the command runs
# as the user, through a PAM session, cannot unmount, and the stop times out.
# "-": systemd also resolves User=%i for "+". A dynamic user (gdm-greeter) can be gone at stop time:
# then the spawn fails with 217/USER and user@<uid>.service stays failed. The script writes its own errors to the journal.
[Service]
ExecStopPost=-+/usr/local/sbin/mld-home-umount %i
