# The NvPCR setup needs the PCR public key that systemd-stub gets from the .pcrpkey section of the UKI.
# The mld UKI (dracut --uefi + sbsign) has no .pcrpkey section. Without this condition the units fail at each boot:
# "Failed to find TPM PCR public key file 'tpm2-pcr-public-key.pem'" (systemd-262-3.fc45, seen 2026-11-18).
[Unit]
ConditionPathExists=/run/systemd/tpm2-pcr-public-key.pem
